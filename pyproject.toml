[project]
name = "iosys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "langchain-core>=0.3.59",
    "langchain-google-genai>=2.1.4",
    "langchain-openai>=0.3.16",
    "langgraph>=0.4.3",
    "markitdown[all]",
    "openai>=1.75.0",
    "juicefs"
]

[tool.uv.sources]
a2a = { path = "a2a_server/a2a-python-sdk" }
markitdown = { path = "markitdown" }
juicefs = { path = "jfs/juicefs-1.3.0-sdk" }

[tool.ruff]
exclude = [
    "jfs/juicefs-1.3.0-sdk",
    "markitdown",
    "a2a_server/a2a-python-sdk",
]
